<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Качели без запчастей — модернизация электрокачелей для младенцев</title>
<meta name="description" content="Модернизация и ремонт электронных качелей для младенцев на Arduino, когда родную плату управления не найти.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔌</text></svg>">
<style>
  :root {
    --bg: #f4f1ec;
    --bg-2: #ffffff;
    --text: #211e1a;
    --text-dim: #6f685e;
    --accent: #d6543f;
    --font-display: "Bahnschrift", "SF Compact Text", "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
    --font-body: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--font-body); overflow: hidden;
  }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }

  .overlay {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: center;
    padding: 6vw; z-index: 2;
  }
  .kicker {
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: 2px;
    font-size: 12px; color: var(--accent); font-weight: 700; margin: 0 0 14px;
  }
  h1 {
    font-family: var(--font-display); font-weight: 700; margin: 0 0 16px;
    font-size: clamp(28px, 6vw, 56px); line-height: 1.08; max-width: 12ch; text-wrap: balance;
  }
  p.lead {
    font-size: clamp(14px, 1.6vw, 18px); color: var(--text-dim); max-width: 34ch; margin: 0 0 28px;
  }
  .cta { pointer-events: auto; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 14px;
    padding: 13px 24px; border-radius: 999px; text-decoration: none;
  }
  .btn.primary { background: var(--accent); color: #fff8f4; }
  .btn.ghost { background: rgba(255,255,255,.5); color: var(--text); border: 1px solid rgba(33,30,26,.18); backdrop-filter: blur(6px); }

  .hint {
    position: fixed; bottom: 22px; right: 26px; z-index: 2;
    font-size: 12px; color: var(--text-dim); font-family: var(--font-display);
    display: flex; align-items: center; gap: 8px; opacity: .8;
  }
  .hint svg { width: 16px; height: 16px; opacity: .8; }

  @media (max-width: 620px) {
    .overlay { padding: 8vw 6vw; justify-content: flex-end; padding-bottom: 14vw; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="overlay">
  <p class="kicker">Качели без запчастей</p>
  <h1>Плата сгорела.<br>Качели — нет.</h1>
  <p class="lead">
    Модернизация электронных качелей для младенцев на Arduino, когда родную плату
    управления уже не найти. Схемы, код и гайды по конкретным моделям.
  </p>
  <div class="cta">
    <a class="btn primary" href="https://serega212121.github.io/kacheli-bez-zapchastey/">Смотреть модели</a>
    <a class="btn ghost" href="https://github.com/serega212121/nuovita-agio-ag2-arduino" target="_blank" rel="noopener">Код на GitHub</a>
  </div>
</div>

<div class="hint">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M4 12h16" stroke-linecap="round"/></svg>
  Потяните, чтобы повернуть
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f1ec);
scene.fog = new THREE.Fog(0xf4f1ec, 7, 15);

// soft studio environment for gentle reflections on the glossy plastic
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment()).texture;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.3, 1.85, 4.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.enablePan = false;
controls.minDistance = 2.2;
controls.maxDistance = 10;
controls.minPolarAngle = 0.6;
controls.maxPolarAngle = 1.6;

// ---- bright, even studio lighting (softbox-style, like a catalog shot) ----
scene.add(new THREE.HemisphereLight(0xffffff, 0xcdc6b8, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(2.2, 4, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -2; key.shadow.camera.right = 2;
key.shadow.camera.top = 2; key.shadow.camera.bottom = -2;
key.shadow.bias = -0.001;
key.shadow.radius = 6;
scene.add(key);
const fillLeft = new THREE.PointLight(0xffffff, 1.1, 10, 2);
fillLeft.position.set(-2.4, 1.6, 1.4);
scene.add(fillLeft);
const fillRight = new THREE.PointLight(0xffffff, 0.9, 10, 2);
fillRight.position.set(2.2, 1.2, -1.6);
scene.add(fillRight);
const bounce = new THREE.PointLight(0xffe9df, 0.5, 8, 2);
bounce.position.set(0, 0.2, 2);
scene.add(bounce);

// ---- materials ----
const shellMat = new THREE.MeshPhysicalMaterial({
  color: 0xf4f1ea, roughness: 0.22, metalness: 0.02, clearcoat: 0.7, clearcoatRoughness: 0.25,
  side: THREE.DoubleSide,
});
const jointMat = new THREE.MeshStandardMaterial({ color: 0x2c2a28, roughness: 0.4, metalness: 0.3 });
const fabricMat = new THREE.MeshStandardMaterial({ color: 0xcfc9c0, roughness: 0.9, metalness: 0.0, side: THREE.DoubleSide });
const accentMat = new THREE.MeshStandardMaterial({ color: 0xe2695a, roughness: 0.4, metalness: 0.1, emissive: 0x5c150f, emissiveIntensity: 0.4 });

const toy = new THREE.Group();
scene.add(toy);

// limb: a smooth rounded tube/cylinder between two arbitrary points, with ball joints at the ends
function limb(a, b, radius, material, capRadius) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(end, start);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 20), material);
  mesh.position.copy(start).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const group = new THREE.Group();
  group.add(mesh);
  if (capRadius) {
    [start, end].forEach((p) => {
      const cap = new THREE.Mesh(new THREE.SphereGeometry(capRadius, 20, 16), material);
      cap.position.copy(p);
      cap.castShadow = true;
      group.add(cap);
    });
  }
  return group;
}

// ---- A-frame stand: two frames (front/back) meeting at a shared top bar ----
const apex = 2.05, spread = 0.92, frameZ = 0.52;
[-frameZ, frameZ].forEach((z) => {
  toy.add(limb([-spread, 0.02, z], [0, apex, z], 0.045, shellMat, 0.05));
  toy.add(limb([spread, 0.02, z], [0, apex, z], 0.045, shellMat, 0.05));
  [-spread, spread].forEach((x) => {
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.08, 0.05, 24), jointMat);
    foot.position.set(x, 0.025, z);
    foot.castShadow = true;
    toy.add(foot);
  });
});
toy.add(limb([0, apex, -frameZ], [0, apex, frameZ], 0.05, shellMat, 0.055));

// motor housing at the top-centre, with the one visible accent detail
const motor = limb([-0.16, apex, 0], [0.16, apex, 0], 0.13, jointMat, 0);
toy.add(motor);
const motorRing = new THREE.Mesh(new THREE.TorusGeometry(0.132, 0.01, 10, 40), accentMat);
motorRing.rotation.y = Math.PI / 2;
motorRing.position.set(0, apex, 0);
toy.add(motorRing);

// ---- seat pod: lathe-revolved bowl (same technique as before), hanging from the bar ----
const seatGroup = new THREE.Group();
seatGroup.position.set(0, apex - 0.98, 0.06);
seatGroup.rotation.x = -0.2;
toy.add(seatGroup);

// hanging rods from the bar down to the seat rim
const rodPairs = [
  [[-0.2, apex - 0.06, -0.18], [-0.4, apex - 0.98 + 0.5, -0.34]],
  [[0.2, apex - 0.06, -0.18], [0.4, apex - 0.98 + 0.5, -0.34]],
  [[-0.16, apex - 0.06, 0.18], [-0.36, apex - 0.98 + 0.44, 0.36]],
  [[0.16, apex - 0.06, 0.18], [0.36, apex - 0.98 + 0.44, 0.36]],
];
rodPairs.forEach(([p1, p2]) => toy.add(limb(p1, p2, 0.014, jointMat, 0)));

const bowlPts = [
  new THREE.Vector2(0.0, 0.0),
  new THREE.Vector2(0.12, 0.015),
  new THREE.Vector2(0.26, 0.08),
  new THREE.Vector2(0.38, 0.22),
  new THREE.Vector2(0.44, 0.36),
  new THREE.Vector2(0.455, 0.48),
  new THREE.Vector2(0.43, 0.58),
  new THREE.Vector2(0.445, 0.63),
];
const shellGeo = new THREE.LatheGeometry(bowlPts, 48);
const seatShell = new THREE.Mesh(shellGeo, shellMat);
seatShell.scale.set(1.0, 1.0, 1.5);
seatShell.castShadow = true;
seatShell.receiveShadow = true;
seatGroup.add(seatShell);

const cushionPts = bowlPts.map((p) => new THREE.Vector2(p.x * 0.86, p.y * 0.9 + 0.05));
const cushion = new THREE.Mesh(new THREE.LatheGeometry(cushionPts, 48), fabricMat);
cushion.scale.set(1.0, 1.0, 1.42);
cushion.position.z = 0.04;
cushion.receiveShadow = true;
seatGroup.add(cushion);

// rounded head-support halo, echoing the reference photo's curved wing
const halo = new THREE.Mesh(
  new THREE.TorusGeometry(0.42, 0.045, 20, 64, Math.PI * 1.1),
  shellMat
);
halo.rotation.set(0, 0, 0);
halo.position.set(0, 0.63, -0.42);
halo.castShadow = true;
seatGroup.add(halo);

// tiny embedded status light — the one visible hint of the electronics inside
const led = new THREE.Mesh(
  new THREE.SphereGeometry(0.018, 12, 12),
  new THREE.MeshStandardMaterial({ color: 0xe2695a, emissive: 0xe2695a, emissiveIntensity: 2.5 })
);
led.position.set(0.3, 0.5, 0.5);
seatGroup.add(led);

// ---- soft contact shadow ----
function makeShadowTexture() {
  const size = 256;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, "rgba(30,25,20,0.22)");
  g.addColorStop(0.7, "rgba(30,25,20,0.08)");
  g.addColorStop(1, "rgba(30,25,20,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(1.5, 48),
  new THREE.MeshBasicMaterial({ map: makeShadowTexture(), transparent: true, depthWrite: false })
);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = 0.002;
scene.add(contactShadow);

// ---- animation ----
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  led.material.emissiveIntensity = 2.2 + Math.sin(t * 1.8) * 0.6;
  toy.rotation.y = Math.sin(t * 0.35) * 0.06;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

const baseDistance = camera.position.distanceTo(controls.target);
function fitCameraDistance(aspect) {
  const dist = aspect < 0.85 ? baseDistance * (1.15 / Math.max(aspect, 0.38)) : baseDistance;
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, Math.min(dist, 12));
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (w < 1 || h < 1) return;
  const aspect = w / h;
  fitCameraDistance(aspect);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener("resize", resize);
resize();
requestAnimationFrame(resize);
setTimeout(resize, 150);
animate();
</script>
</body>
</html>
