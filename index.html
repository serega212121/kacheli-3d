<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Качели без запчастей — модернизация электрокачелей для младенцев</title>
<meta name="description" content="Модернизация и ремонт электронных качелей для младенцев на Arduino, когда родную плату управления не найти.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔌</text></svg>">
<style>
  :root {
    --bg: #f4f1ec;
    --text: #211e1a;
    --text-dim: #6f685e;
    --accent: #d6543f;
    --font-display: "Bahnschrift", "SF Compact Text", "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
    --font-body: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--font-body);
  }
  body {
    display: flex; flex-wrap: wrap; align-items: center;
    min-height: 100vh; padding: 6vw; gap: 6vw;
  }

  .copy { flex: 1 1 420px; max-width: 640px; }
  .kicker {
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: 2px;
    font-size: 12px; color: var(--accent); font-weight: 700; margin: 0 0 14px;
  }
  h1 {
    font-family: var(--font-display); font-weight: 700; margin: 0 0 16px;
    font-size: clamp(28px, 5vw, 52px); line-height: 1.08; max-width: 12ch; text-wrap: balance;
  }
  p.lead {
    font-size: clamp(14px, 1.6vw, 18px); color: var(--text-dim); max-width: 34ch; margin: 0 0 28px;
  }
  .cta { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 14px;
    padding: 13px 24px; border-radius: 999px; text-decoration: none;
  }
  .btn.primary { background: var(--accent); color: #fff8f4; }
  .btn.ghost { background: rgba(255,255,255,.6); color: var(--text); border: 1px solid rgba(33,30,26,.18); }

  .stage {
    flex: 1 1 380px; max-width: 560px; display: flex; justify-content: center;
    perspective: 1400px;
  }
  .tilt-wrap {
    position: relative; width: 100%; max-width: 460px;
  }
  .tilt-card {
    width: 100%; aspect-ratio: 1 / 1; border-radius: 28px; overflow: hidden;
    transform-style: preserve-3d; transition: transform .25s ease-out;
    box-shadow: 0 30px 60px -20px rgba(30,25,20,.28), 0 10px 24px -12px rgba(30,25,20,.18);
    background: #fff;
  }
  .tilt-card img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transform: translateZ(0);
  }
  .tilt-glow {
    position: absolute; inset: -10%; border-radius: 50%;
    background: radial-gradient(circle, rgba(214,84,63,.16), transparent 65%);
    filter: blur(20px); z-index: -1;
  }

  .hint {
    position: fixed; bottom: 22px; right: 26px;
    font-size: 12px; color: var(--text-dim); font-family: var(--font-display);
    display: flex; align-items: center; gap: 8px; opacity: .8;
  }
  .hint svg { width: 16px; height: 16px; opacity: .8; }

  @media (max-width: 760px) {
    body { flex-direction: column-reverse; padding: 8vw 6vw; gap: 8vw; }
    .stage { max-width: 100%; }
    .tilt-wrap { max-width: 320px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div class="copy">
  <p class="kicker">Качели без запчастей</p>
  <h1>Плата сгорела.<br>Качели — нет.</h1>
  <p class="lead">
    Модернизация электронных качелей для младенцев на Arduino, когда родную плату
    управления уже не найти. Схемы, код и гайды по конкретным моделям.
  </p>
  <div class="cta">
    <a class="btn primary" href="https://serega212121.github.io/kacheli-bez-zapchastey/">Смотреть модели</a>
    <a class="btn ghost" href="https://github.com/serega212121/nuovita-agio-ag2-arduino" target="_blank" rel="noopener">Код на GitHub</a>
  </div>
</div>

<div class="stage">
  <div class="tilt-wrap">
    <div class="tilt-glow"></div>
    <div class="tilt-card" id="tiltCard">
      <img src="assets/hero-swing.jpg" alt="Электронные качели для младенцев, стилизованное изображение">
    </div>
  </div>
</div>

<div class="hint">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h16M14 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Двигайте курсором
</div>

<script>
const card = document.getElementById("tiltCard");
const wrap = card.closest(".tilt-wrap");
const maxTilt = 10;

function applyTilt(px, py) {
  const rect = wrap.getBoundingClientRect();
  const x = (px - rect.left) / rect.width;
  const y = (py - rect.top) / rect.height;
  const rx = (0.5 - y) * maxTilt * 2;
  const ry = (x - 0.5) * maxTilt * 2;
  card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) scale(1.02)`;
}
function resetTilt() {
  card.style.transform = "rotateX(0deg) rotateY(0deg) scale(1)";
}

window.addEventListener("pointermove", (e) => {
  if (e.pointerType === "touch") return;
  applyTilt(e.clientX, e.clientY);
});
window.addEventListener("pointerleave", resetTilt);
document.addEventListener("mouseleave", resetTilt);

let lastTouch = 0;
window.addEventListener("touchmove", (e) => {
  const now = Date.now();
  if (now - lastTouch < 40) return;
  lastTouch = now;
  const t = e.touches[0];
  if (t) applyTilt(t.clientX, t.clientY);
}, { passive: true });
window.addEventListener("touchend", resetTilt);
</script>

</body>
</html>
